plugins {
    id 'config.example-app'
}

dependencies {
    implementation project(':grails-passwordless-login')

    console "org.apache.grails:grails-console"
    developmentOnly "org.springframework.boot:spring-boot-devtools"
    implementation platform("org.apache.grails:grails-hibernate7-bom:$grailsVersion")
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.security:spring-security-webauthn"
    implementation "org.apache.grails:grails-core"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.apache.grails:grails-logging"
    implementation "org.apache.grails:grails-rest-transforms"
    implementation "org.apache.grails:grails-databinding"
    implementation "org.apache.grails:grails-services"
    implementation "org.apache.grails:grails-url-mappings"
    implementation "org.apache.grails:grails-layout"
    implementation "org.apache.grails:grails-interceptors"
    implementation "org.apache.grails:grails-data-hibernate7"
    implementation "org.apache.grails:grails-data-hibernate7-dbmigration"
    implementation "org.apache.grails:grails-gsp"
    integrationTestImplementation testFixtures("org.apache.grails:grails-geb")
    profile "org.apache.grails.profiles:web"
    runtimeOnly "org.postgresql:postgresql"
    runtimeOnly "com.zaxxer:HikariCP"
    runtimeOnly "cloud.wondrify:asset-pipeline-grails"
    testImplementation "org.apache.grails:grails-testing-support-datamapping"
    testImplementation "org.spockframework:spock-core"
    testImplementation "org.apache.grails:grails-testing-support-web"
    // The database is the plugin's own schema (its Liquibase changelog) on PostgreSQL, as in the applications that use it.
    testImplementation "org.testcontainers:testcontainers"
    testImplementation "org.testcontainers:testcontainers-postgresql"
    // A software authenticator, so specs can register and use passkeys over plain HTTP.
    testImplementation "com.webauthn4j:webauthn4j-test:$webauthn4jTestVersion"
}

tasks.withType(Test).configureEach {
    // Docker is needed for the integration specs
    systemProperty 'java.net.preferIPv4Stack', 'true'
}
